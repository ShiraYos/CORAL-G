environment_generator_node:
  ros__parameters:
    cell_size_m: 0.5
    current_strength: 0.3
    current_heading_deg: 45.0
    wind_x: 0.1
    wind_y: 0.05
    wave_height: 0.2
    confidence: 0.9

environment_node:
  ros__parameters:
    cell_size_m: 0.5
    tick_rate_hz: 1.0
    debris_drift_enabled: true
    debris_drift_scale: 0.015
    physical_debris_seed: 23
    # Proximity collection: environment_node fires /collection_event when the robot
    # is within collection_radius_m of a physical particle. The /goal_reached event
    # (from mission_planner_node after nav success) triggers an immediate proximity sweep.
    proximity_collection_enabled: true
    collection_radius_m: 0.35

debris_prediction_node:
  ros__parameters:
    publish_rate_hz: 0.5
    prediction_debris_count: 25
    simulation_horizon_sec: 60.0
    random_seed: 23
    # Drift re-enabled: prediction and physical particles share the same motion model
    # and environment field, so they converge to the same vortex-attractor clusters
    # within ~5 minutes. Density map reliably tracks actual debris locations.
    prediction_drift_enabled: true
    prediction_drift_scale: 0.015

digital_twin_state_node:
  ros__parameters:
    cell_size_m: 0.5

field_planner_node:
  ros__parameters:
    plan_rate_hz: 2.0
    fuel_return_threshold: 0.25
    storage_return_threshold: 1.0
    density_reward_weight: 1.0
    travel_cost_weight: 0.4
    storage_penalty_weight: 0.5
    fuel_penalty_weight: 0.5
    map_risk_weight: 0.5
    return_reserve: 0.2
    # Normalized density cells can be far below 0.1. The demo profile keeps the
    # node code default conservative while allowing valid normalized density to
    # produce visible mission goals.
    min_density_reward: 0.001
